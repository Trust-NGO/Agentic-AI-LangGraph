name: RAG Application CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python files
        run: |
          python -m compileall app api_main.py main.py

      - name: Build FastAPI Docker image
        run: |
          docker build -t rag-api:ci -f Dockerfile .

      - name: Build Streamlit Docker image
        run: |
          docker build -t rag-streamlit:ci -f Dockerfile.streamlit .